# =====================================================================
#  docker-compose.yml
# =====================================================================

services:

  # ----------------------------------------------------------------
  # BACKEND  (FastAPI + uvicorn, port 8000)
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: rag-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "main_rag:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  # ----------------------------------------------------------------
  # FRONTEND  (React + Vite dev server, port 5173)
  # ----------------------------------------------------------------
  frontend:
    build:
      context: frontend-rag/react
    container_name: rag-frontend
    restart: unless-stopped
    expose:
      - "5173"
    volumes:
      - ./frontend-rag/react:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

  # ----------------------------------------------------------------
  # NGINX  (Reverse Proxy, port 80)
  # ----------------------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: rag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend